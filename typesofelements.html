<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of Elements</title>
</head>
<body>
    <!-- Block elements -->
     <div>Hello</div>
     <div>World</div>

     <header>Welcome to</header>
     <HEADER>HTML</HEADER>
    
     <H1>Hello</H1>
     <h2>World</h2>


     <!-- inline elements -->

     <a href="http://www.google.com">Google link</a>
     <a href="http://www.icicbank.com">ICICI Bank</a>

     <span>
        Hello
     </span>

    <span>World</span>
</body>
</html>
