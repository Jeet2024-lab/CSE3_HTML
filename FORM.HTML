<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <fieldset>
        <legend>Biodata</legend>

        <form action="./response.html">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="enter your email" required>

            <br><br>
            <label for="passwd">Password:</label>
            <input type="password" name="passwd" id="passwd">
            <br>
            <br>
            <label for="gen">Gender:</label>
            <input type="radio" name="gen" id="gen">
            <label for="male">Male</label>
            <input type="radio" name="gen" id="gen">
            <label for="Female">FeMale</label>
            <br><br>
            <label for="hobb">Hobbies</label>
            <input type="checkbox" name="check1" id="crick">
            <label for="crick">Cricket</label>
            <input type="checkbox" name="check2" id="crick">
            <label for="carem">carem</label>

            <br><br>
            <select name="lang" id="lang">
                <option value="select">Select one lang</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Python">Python</option>


            </select>
            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob">
            <br><br>
            <label for="attempt">Attempt:</label>
            <input type="number" name="attempt" id="attempt">
            <br><br>
            <label for="url">Enter your HomePage:</label>
            <input type="url" id="url" name="url">
            <br><br>
            <label for="file">Upload Your Resume:</label>
            <input type="file" name="file" id="file">
            <br><br>
            <input type="submit">
            <input type="Reset">
        </form>
    </fieldset>


</body>

</html>
